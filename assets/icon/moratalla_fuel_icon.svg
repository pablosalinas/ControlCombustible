<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <!-- Cyan Gauge & Hose Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Amber Fuel Droplet Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Castle Steel Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Inner Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle Base App Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#iconShadow)" />

  <!-- Subtle Squircle Inner Border -->
  <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />

  <!-- Circular Dial Gauge & Hose Track -->
  <g transform="translate(256, 256)">
    <!-- Dial ticks for fuel gauge -->
    <g stroke="#38bdf8" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-175" x2="0" y2="-160" />
      <line x1="45" y1="-169" x2="41" y2="-154" />
      <line x1="88" y1="-151" x2="80" y2="-137" />
      <line x1="124" y1="-123" x2="113" y2="-112" />
      <line x1="151" y1="-87" x2="138" y2="-79" />
      <line x1="168" y1="-44" x2="153" y2="-40" />
      <line x1="174" y1="0" x2="158" y2="0" stroke-width="5" stroke-opacity="0.8" />
      <line x1="168" y1="44" x2="153" y2="40" />
      <line x1="151" y1="87" x2="138" y2="79" />
    </g>

    <!-- Outer Circular Hose Loop -->
    <path d="M -130,120 A 176,176 0 1,1 176,0 A 176,176 0 0,1 115,135" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Secondary Accent Ring -->
    <path d="M -110,135 A 152,152 0 1,1 152,0" 
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3" stroke-linecap="round" />

    <!-- Castle of Moratalla (Fortaleza & Torre del Homenaje) -->
    <path d="M -115,120 
             L -115,-10 
             L -95,-10 L -95,5 L -80,5 L -80,-10 L -60,-10 L -60,5 L -45,5 L -45,-10 L -25,-10
             L -25,25 
             L 25,25 
             L 25,-45 
             L 5,-45 L 5,-32 L -8,-32 L -8,-45 L -20,-45
             L 25,-45
             L 45,-45 L 45,-32 L 60,-32 L 60,-45 L 80,-45 L 80,-32 L 95,-32 L 95,-45 L 115,-45
             L 115,120 
             Z" 
          fill="url(#steelGrad)" />

    <!-- Castle Portal / Arch Gate -->
    <path d="M -15,120 A 25,25 0 0,1 15,120 Z" fill="#0b1329" />

    <!-- Tower Windows / Saeteras -->
    <rect x="-92" y="20" width="12" height="24" rx="6" fill="#0b1329" />
    <rect x="64" y="-12" width="14" height="28" rx="7" fill="#0b1329" />

    <!-- Fuel Dispenser Nozzle (Pistola de Repostaje) -->
    <g transform="translate(-50, -85) rotate(-35)">
      <!-- Nozzle spout -->
      <path d="M -40,-12 L 35,-12 L 65,15 L 75,13 L 42,-22 L -40,-22 Z" fill="#e2e8f0" />
      <!-- Nozzle main grip body -->
      <rect x="-85" y="-35" width="55" height="46" rx="10" fill="url(#cyanGrad)" />
      <!-- Trigger guard & handle -->
      <path d="M -80,11 L -45,11 L -50,55 L -75,55 Z" fill="url(#cyanGrad)" />
      <path d="M -70,18 L -55,18 L -58,45 L -68,45 Z" fill="#0b1329" />
      <!-- Metallic accent joint -->
      <circle cx="-35" cy="-12" r="7" fill="#f8fafc" />
    </g>

    <!-- Glowing Fuel Droplet (Gota de Carburante) -->
    <g transform="translate(62, -88) scale(0.95)" filter="url(#softGlow)">
      <path d="M 0,-42 C 16,-20 34,5 34,26 A 34,34 0 1,1 -34,26 C -34,5 -16,-20 0,-42 Z" 
            fill="url(#amberGrad)" />
      <!-- Highlight reflection -->
      <ellipse cx="-10" cy="18" rx="8" ry="14" transform="rotate(-25 -10 18)" fill="#ffffff" fill-opacity="0.55" />
    </g>

    <!-- Fuel Level Indicator Needle -->
    <polygon points="135,-3 145,0 135,3 105,0" fill="#f59e0b" />
  </g>

  <!-- Bottom App Legend Badge -->
  <g transform="translate(256, 435)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" />
    <text x="0" y="5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
      MORATALLA • FUEL
    </text>
  </g>
</svg>
