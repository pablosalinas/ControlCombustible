name: 📱 Compilar APK Android (Flutter)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Generar APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 🔧 Inicializar plataforma Android (si falta carpeta android nativa)
        working-directory: ./flutter_app
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.moratallamurcia.combustible .
          fi
          flutter pub get

      - name: 🏗️ Compilar APK Release
        working-directory: ./flutter_app
        run: |
          flutter build apk --release

      - name: 📦 Publicar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: ControlCombustible-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
