name: 📱 Compilar y Publicar APK Android (Flutter)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Generar APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 21 (Requerido por Android Lint / AGP en Flutter 3.50+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 💙 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Cachear Gradle y configurar espejo Maven Central
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🌐 Configurar espejo Google Maven Central para evitar HTTP 429
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/mirror.gradle
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2"
          gradle.settingsEvaluated { settings ->
              settings.pluginManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("repo.maven.apache.org")) {
                      repo.setUrl(mirrorUrl)
                  }
              }
              settings.dependencyResolutionManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("repo.maven.apache.org")) {
                      repo.setUrl(mirrorUrl)
                  }
              }
          }
          allprojects {
              repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("repo.maven.apache.org")) {
                      repo.setUrl(mirrorUrl)
                  }
              }
          }
          EOF

      - name: 📅 Calcular versión Vx.aammdd
        run: |
          AAMMDD=$(date +%y%m%d)
          BUILD_NUM=$(date +%y%m%d%H)
          echo "AAMMDD=$AAMMDD" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=V1.${AAMMDD}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV

      - name: 🔐 Preparar Keystore de Firma Persistente
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.jks
            echo "ANDROID_KEYSTORE_PATH=/tmp/release.jks" >> $GITHUB_ENV
          else
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/flutter_app/signing/release.jks" >> $GITHUB_ENV
          fi

      - name: 🔧 Inicializar Android, Iconos _v2 y Desactivar R8 / LintVital
        working-directory: ./flutter_app
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.moratallamurcia.combustible .
          fi

          # 1. Instalar iconos generados _v2 en todas las densidades mipmap de Android
          cp -r assets/android_res/mipmap-* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -f "$dir/ic_launcher.png" ]; then
              cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png" || true
            fi
          done

          # 2. Asegurar permisos de Internet y Cámara y nombre de la app en AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.CAMERA"\/><application/' "$MANIFEST"
          fi
          sed -i 's/android:label="control_combustible_app"/android:label="Control Combustible"/g' "$MANIFEST" || true

          # 3. Crear reglas ProGuard/R8 por seguridad
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF

          # 4. Configurar minSdk = 23, firma persistente release, desactivar minify/R8 y lintVital
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
            cat << 'EOF' >> android/app/build.gradle.kts

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("KEYSTORE_PASSWORD")?.takeIf { it.isNotBlank() } ?: "MoratallaCombustible2026"
                      keyAlias = System.getenv("KEY_ALIAS")?.takeIf { it.isNotBlank() } ?: "combustible"
                      keyPassword = System.getenv("KEY_PASSWORD")?.takeIf { it.isNotBlank() } ?: "MoratallaCombustible2026"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF
          fi

          # 5. Desactivar tareas lintVital en todos los subproyectos (como image_picker_android)
          if [ -f "android/build.gradle.kts" ]; then
            cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              tasks.matching { it.name.contains("lintVital", ignoreCase = true) }.configureEach {
                  enabled = false
              }
          }
          EOF
          fi

          flutter pub get

      - name: 🏗️ Compilar APK Release
        working-directory: ./flutter_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for i in 1 2 3; do
            if flutter build apk --release --build-name="${{ env.APP_VERSION_NAME }}" --build-number="${{ env.APP_BUILD_NUMBER }}" --dart-define=APP_VERSION="${{ env.APP_VERSION_NAME }}"; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              exit 1
            fi
            echo "Fallo en Gradle (posible 429 de red), reintentando en 15s (intento $i/3)..."
            sleep 15
          done
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ControlCombustible.apk

      - name: 📦 Subir APK como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ControlCombustible-APK
          path: flutter_app/build/app/outputs/flutter-apk/ControlCombustible.apk

      - name: 🚀 Publicar Descarga Directa en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_NAME }}
          name: "Control de Combustible ${{ env.APP_VERSION_NAME }} (APK)"
          body: "Versión ${{ env.APP_VERSION_NAME }} — Descarga directa del instalador Android (`ControlCombustible.apk`). Incluye gestión SCRUB de vehículos, envío de PDFs por email/compartir, y firma persistente para actualizaciones directas sin desinstalar (nota: si actualizas desde una versión anterior a V1.261118, desinstala la app antigua una única vez antes de instalar esta)."
          files: flutter_app/build/app/outputs/flutter-apk/ControlCombustible.apk
          prerelease: false
