name: 🚀 Despliegue a Producción (moratalla-murcia.com/combustible)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Subir API y Crear Tablas Aditivas en Producción
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🚀 Subir archivos al servidor IONOS por SFTP (mismo sistema que moratalla-murcia.com)
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USER }}
          PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "Despliegue delegado al workflow principal de Moratalla-Murcia-2026."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "set sftp:auto-confirm yes; open sftp://${USER}:${PASS}@${HOST}; mirror -R -v --ignore-time --parallel=10 --exclude-glob .git/ --exclude-glob .github/ --exclude-glob flutter_app/ ./ ${REMOTE_PATH}/combustible/"
          lftp -c "set sftp:auto-confirm yes; open sftp://${USER}:${PASS}@${HOST}; mirror -R -v --ignore-time --parallel=10 --exclude-glob .git/ --exclude-glob .github/ --exclude-glob flutter_app/ ./ ${REMOTE_PATH}/../combustible/" || true

      - name: 🗄️ Ejecutar creación aditiva de tablas en Producción (setup_db.php)
        run: |
          curl -f -s -S "https://www.moratalla-murcia.com/combustible/setup_db.php" || true
          curl -f -s -S "https://www.moratalla-murcia.com/moratalla/combustible/setup_db.php" || true
