name: control_combustible_app
description: Aplicacion Android para control de gastos y consumo de vehiculos conectada a moratalla-murcia.com
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  pdf: ^3.11.0
  printing: ^5.13.1
  path_provider: ^2.1.3
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_v2.png
    - assets/fonts/Roboto-Regular.ttf
